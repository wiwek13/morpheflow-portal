name: Release native packages

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version (e.g. 2.4.1, defaults to package.json)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VER="${{ inputs.version }}"
          else
            VER="$(node -p "require('./package.json').version")"
          fi
          # strip leading v from tag builds
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Version: $VER"

      - name: Build .deb / .rpm (amd64)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl
          chmod +x packaging/build.sh packaging/postinst.sh packaging/prerm.sh
          ./packaging/build.sh --version "${{ steps.ver.outputs.version }}" --arch amd64

      - name: Build AppImage (x86_64)
        run: |
          chmod +x packaging/appimage/build-appimage.sh
          ./packaging/appimage/build-appimage.sh --version "${{ steps.ver.outputs.version }}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
