architecture: arm64-v8a
striplibs: true

low_spec_mode: true

schedule_time: "03:00"
run_on_startup: false
timezone: "Etc/UTC"

max_logs: 5
max_original_packages: null
max_patched_packages: null

packages:
  - package: com.reddit.frontpage
    package_name: Reddit
    repos:
      - https://github.com/MorpheApp/morphe-patches
      - https://github.com/Alastor-Kaneki/Morphe-Patches
      - https://github.com/jkennethcarino/adobo
      - https://github.com/Mubelotix/my-morphe-patches
      - https://github.com/Santodan/santodan-patches

  - package: com.truecaller
    package_name: Truecaller
    repos:
      - https://github.com/heval99/Heval-Morphe-Patches

  - package: com.instaprime.android
    package_name: InstaPrime
    repos:
      - https://github.com/drappula/morphe-patches-instaprime

  - package: com.spocky.projengmenu
    package_name: Projectivy Launcher
    repos:
      - https://gitlab.com/johninnld/nl-morphe-patches
      - https://github.com/saieshshirodkar/saiesh-morphe-patches
      - https://github.com/hxreborn/morphe-patches



# ---------------------------------------------------------------------------
# Email Dispatcher Configuration
# ---------------------------------------------------------------------------
email:
  enabled: false
  smtp_server: 
  smtp_port:
  use_tls: true                  # STARTTLS (typically port 587)
  use_ssl: false                 # Direct SSL/TLS (typically port 465)
  sender_name: "MorpheFlow"
  sender_email:
  recipients:

  subject_prefix: "[MorpheFlow]"
  attach_result_json: false      # Optional attachment of result.json to email
  layout_mode: "auto"            # "auto" (compact if > threshold), "compact", or "cards"
  compact_threshold: 15          # App count above which email switches to compact view
